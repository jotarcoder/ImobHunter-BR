[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imobhunter-br"
version = "0.1.0"
description = "Inteligência imobiliária local-first para prospecção de imóveis no Brasil."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
imobhunter = "imobhunter.app:main"

[tool.setuptools.packages.find]
include = ["imobhunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
