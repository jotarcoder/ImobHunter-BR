[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imobhunter-br"
version = "0.1.5"
description = "Inteligência imobiliária local-first para prospecção de imóveis no Brasil."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "fastapi>=0.115,<1"]

[project.scripts]
imobhunter = "imobhunter.app:main"

[tool.setuptools.packages.find]
include = ["imobhunter*"]

[tool.setuptools.package-data]
imobhunter = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["imobhunter"]
