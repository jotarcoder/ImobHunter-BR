<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImobHunter-BR • Central de Licenças</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main class="admin-shell">
<section class="admin-card" id="login"><p class="eyebrow">IMOBHUNTER-BR • ADMIN</p><h1>Central de licenças.</h1><p>Controle de ativações com a mesma linguagem visual da plataforma.</p>
<form id="login-form"><input id="email" type="email" value="juninhoovf@gmail.com" autocomplete="username" readonly><input id="password" type="password" placeholder="Senha do Supabase Auth" autocomplete="current-password" required><button class="button primary">Entrar <span>↗</span></button></form><div id="login-error" class="error"></div></section>
<section class="dashboard hidden" id="dashboard"><header class="dash-head"><div><p class="eyebrow">CONFIANÇA POR DESIGN</p><h1>Licenças em controle.</h1></div><button class="button" id="logout">Sair</button></header>
<div class="dash-grid"><article class="panel"><span>LICENÇAS</span><strong id="total">—</strong><small>cadastradas</small></article><article class="panel"><span>ATIVAS</span><strong id="active">—</strong><small>disponíveis</small></article><article class="panel"><span>DISPOSITIVOS</span><strong id="devices">—</strong><small>ativações</small></article></div>
<section class="panel table-panel"><div class="panel-head"><div><span>CENTRAL DE ATIVAÇÃO</span><h2>Emitir e controlar.</h2></div><button class="button primary" id="new-license">Nova licença +</button></div>
<div class="create-box hidden" id="create-box"><input id="max-devices" type="number" min="1" max="25" value="1"><input id="expires" type="datetime-local"><input id="notes" type="text" placeholder="Observação opcional"><button class="button primary" id="create-license">Gerar chave</button></div>
<div id="generated" class="generated hidden"></div><div id="licenses" class="license-list"></div></section></section>
</main><script src="/admin/admin.js" defer></script></body></html>
