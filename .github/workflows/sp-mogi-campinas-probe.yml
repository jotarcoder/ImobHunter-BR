name: SP Mogi / Campinas public cadastral source discovery

on:
  pull_request:
    paths:
      - "scripts/probe_sp_mogi_campinas.py"
      - ".github/workflows/sp-mogi-campinas-probe.yml"
      - "docs/SP_MOGI_CAMPINAS_SOURCES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public HTTP reader only
        run: python -m pip install "httpx>=0.27,<1"
      - name: Inspect municipal public metadata and read-only route hints
        run: python scripts/probe_sp_mogi_campinas.py
      - name: Upload catalogue evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mogi-campinas-public-gis-metadata
          path: sp-mogi-campinas-public-sources.json
          if-no-files-found: warn
          retention-days: 7
