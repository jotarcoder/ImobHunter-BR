name: Release installers

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Tag version release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
      should_release: ${{ steps.ref.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("project version not found")
          print(match.group(1))
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Confirm version tag exists and release is not already published
        id: ref
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOULD_RELEASE=false
          REF="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_RELEASE=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Pull requests may validate packaging, but must never publish a release.
            SHOULD_RELEASE=false
          else
            git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION" || true
            TAG_SHA="$(git rev-parse "refs/tags/v$VERSION^{commit}" 2>/dev/null || true)"
            if [ -n "$TAG_SHA" ]; then
              # Build from the triggering commit, not the tag's historical target.
              # This prevents a prematurely-created tag from building stale metadata.
              REF="$GITHUB_SHA"
              if ! gh release view "v$VERSION" >/dev/null 2>&1; then
                SHOULD_RELEASE=true
              fi
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION; should_release=$SHOULD_RELEASE; ref=$REF"

  windows:
    needs: meta
    if: github.event_name == 'pull_request' || needs.meta.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packaging tools
        run: python -m pip install -e ".[desktop]" pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Validate application version metadata
        shell: powershell
        run: |
          $projectVersion = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $packageVersion = (Select-String -Path imobhunter/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          $resourceVersion = (Select-String -Path packaging/windows/version_info.txt -Pattern "StringStruct\('ProductVersion', '([^']+)'\)").Matches.Groups[1].Value
          if (-not $projectVersion -or $projectVersion -ne $packageVersion -or $projectVersion -ne $resourceVersion) {
            throw "Versões divergentes: projeto=$projectVersion pacote=$packageVersion recurso=$resourceVersion"
          }
          Write-Host "Versão validada: $projectVersion"
      - name: Build executable
        shell: powershell
        run: python -m PyInstaller --noconfirm --windowed --name ImobHunter-BR --version-file packaging/windows/version_info.txt --add-data "imobhunter/assets;imobhunter/assets" --add-data "data/coverage/ddd.json;data/coverage" packaging/entrypoint.py
      - name: Build installer and verify its embedded version
        shell: powershell
        run: |
          $expectedVersion = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          iscc "/DMyAppVersion=$expectedVersion" packaging/windows/ImobHunter-BR.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setupPath = "packaging/windows/Output/ImobHunter-BR-Setup-Windows.exe"
          if (-not (Test-Path $setupPath)) { throw "Installer not generated: $setupPath" }
          $setupInfo = (Get-Item $setupPath).VersionInfo
          $actualVersion = ([string]$setupInfo.ProductVersion).Trim()
          if ($actualVersion -notmatch "^$([regex]::Escape($expectedVersion))(\.0)?$") {
            throw "Installer version mismatch: expected=$expectedVersion; ProductVersion=$actualVersion; FileVersion=$($setupInfo.FileVersion)"
          }
          Write-Host "Installer metadata verified: ProductVersion=$actualVersion; FileVersion=$($setupInfo.FileVersion)"
      - uses: actions/upload-artifact@v4
        with:
          name: ImobHunter-BR-Windows
          path: packaging/windows/Output/ImobHunter-BR-Setup-Windows.exe
          if-no-files-found: error

  linux:
    needs: meta
    if: needs.meta.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[desktop]" pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --name ImobHunter-BR --add-data "imobhunter/assets:imobhunter/assets" --add-data "data/coverage/ddd.json:data/coverage" packaging/entrypoint.py
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -r dist/ImobHunter-BR AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/imobhunter.desktop AppDir/usr/share/applications/imobhunter.desktop
          cp packaging/linux/imobhunter.desktop AppDir/imobhunter.desktop
          cp imobhunter/assets/logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/imobhunter.svg
          cp imobhunter/assets/logo.svg AppDir/imobhunter.svg
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir ImobHunter-BR-Linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ImobHunter-BR-Linux
          path: ImobHunter-BR-Linux.AppImage
          if-no-files-found: error

  macos-intel:
    needs: meta
    if: needs.meta.outputs.should_release == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[desktop]" pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --name ImobHunter-BR --add-data "imobhunter/assets:imobhunter/assets" packaging/entrypoint.py
      - name: Package macOS Intel DMG (retry transient disk-image errors)
        shell: bash
        run: |
          set -euo pipefail
          rm -f ImobHunter-BR-macOS-Intel.dmg ImobHunter-BR-macOS-Intel.tmp.dmg
          for attempt in 1 2 3; do
            if hdiutil create -volname ImobHunter-BR -srcfolder dist/ImobHunter-BR.app -ov -format UDZO ImobHunter-BR-macOS-Intel.tmp.dmg; then
              mv ImobHunter-BR-macOS-Intel.tmp.dmg ImobHunter-BR-macOS-Intel.dmg
              exit 0
            fi
            rm -f ImobHunter-BR-macOS-Intel.tmp.dmg
            if [ "$attempt" -lt 3 ]; then
              echo "hdiutil falhou na tentativa $attempt; aguardando antes de repetir..."
              sleep 5
            fi
          done
          echo "::error::Não foi possível criar o DMG Intel após 3 tentativas."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ImobHunter-BR-macOS-Intel
          path: ImobHunter-BR-macOS-Intel.dmg
          if-no-files-found: error

  macos-arm:
    needs: meta
    if: needs.meta.outputs.should_release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[desktop]" pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --name ImobHunter-BR --add-data "imobhunter/assets:imobhunter/assets" packaging/entrypoint.py
      - run: hdiutil create -volname ImobHunter-BR -srcfolder dist/ImobHunter-BR.app -ov -format UDZO ImobHunter-BR-macOS-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ImobHunter-BR-macOS-AppleSilicon
          path: ImobHunter-BR-macOS-AppleSilicon.dmg
          if-no-files-found: error

  publish:
    needs: [meta, windows, linux, macos-intel, macos-arm]
    if: success() && needs.meta.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            release/ImobHunter-BR-Windows/*
            release/ImobHunter-BR-Linux/*
            release/ImobHunter-BR-macOS-Intel/*
            release/ImobHunter-BR-macOS-AppleSilicon/*
          generate_release_notes: true
