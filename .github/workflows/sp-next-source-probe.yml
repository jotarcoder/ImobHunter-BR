name: SP Ribeirão / Geosanja public service discovery

on:
  pull_request:
    paths:
      - "scripts/probe_sp_next_municipal.py"
      - ".github/workflows/sp-next-source-probe.yml"
      - "docs/SP_NEXT_SOURCES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only HTTP client
        run: python -m pip install "httpx>=0.27,<1"
      - name: Inspect public source metadata without querying private property records
        run: python scripts/probe_sp_next_municipal.py
      - name: Upload metadata evidence (not installers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp-ribeirao-geosanja-public-metadata
          path: sp-next-public-service-discovery.json
          if-no-files-found: warn
          retention-days: 7
