name: Live municipal integration smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "imobhunter/sources/**"
      - "tests/test_official_municipal_services.py"
      - "scripts/live_municipal_smoke.py"
      - ".github/workflows/live-municipal-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-municipal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      # This job diagnoses live third-party municipal services. Their uptime and
      # TLS certificate chains are outside this repository's control, so preserve
      # failures in the uploaded report without making code CI red for outages.
      - name: Diagnose real addresses and generate coverage report (external service)
        continue-on-error: true
        run: python -u scripts/live_municipal_smoke.py --report-file artifacts/national-coverage-report.json
      - name: Upload municipal coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-municipal-coverage-report
          path: artifacts/national-coverage-report.json
          if-no-files-found: warn
          retention-days: 14
