name: SP Campinas Santo Andre Jundiai public fiscal route metadata

on:
  pull_request:
    paths:
      - "scripts/probe_sp_fiscal_public_routes.py"
      - ".github/workflows/sp-public-fiscal-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only HTTP client
        run: python -m pip install "httpx>=0.27,<1"
      - name: Probe public page and same-domain JS path metadata
        run: python scripts/probe_sp_fiscal_public_routes.py
      - name: Preserve public metadata evidence (no user records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp-fiscal-public-route-metadata
          path: sp-public-fiscal-route-metadata.json
          if-no-files-found: warn
          retention-days: 7
