name: Deploy license service to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "15895c53eb86fc8d91e14e9b4456b656"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy license API
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable automatic Worker deployment."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml
