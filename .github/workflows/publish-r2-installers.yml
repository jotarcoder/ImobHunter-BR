name: Publish installers to Cloudflare R2

on:
  workflow_run:
    workflows: ["Release installers"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to publish
        required: true
        default: v0.1.10

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            # Push and completed-release events use the latest published release.
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing installers from $tag"

      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ImobHunter-BR-Setup-Windows.exe" \
            --pattern "ImobHunter-BR-Linux.AppImage" \
            --pattern "ImobHunter-BR-macOS-Intel.dmg" \
            --pattern "ImobHunter-BR-macOS-AppleSilicon.dmg"
          for file in \
            "ImobHunter-BR-Setup-Windows.exe" \
            "ImobHunter-BR-Linux.AppImage" \
            "ImobHunter-BR-macOS-Intel.dmg" \
            "ImobHunter-BR-macOS-AppleSilicon.dmg"; do
            test -s "$file"
          done

      - name: Configure AWS CLI for Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing R2 credentials in repository secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          # GitHub secrets can be pasted with a trailing newline; normalize without logging credentials.
          AWS_ACCESS_KEY_ID="$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d "\r\n")"
          AWS_SECRET_ACCESS_KEY="$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d "\r\n")"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 credentials are empty after whitespace normalization."
            exit 1
          fi
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region auto

      - name: Upload installers to public R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://15895c53eb86fc8d91e14e9b4456b656.r2.cloudflarestorage.com"
          public_base="https://pub-6bd1ab819504434691f4832d98de3cb6.r2.dev"
          for file in \
            "ImobHunter-BR-Setup-Windows.exe" \
            "ImobHunter-BR-Linux.AppImage" \
            "ImobHunter-BR-macOS-Intel.dmg" \
            "ImobHunter-BR-macOS-AppleSilicon.dmg"; do
            aws s3 cp "$file" "s3://imobhunter-downloads/$file" --endpoint-url "$endpoint" --only-show-errors \
              --content-type "application/octet-stream" \
              --content-disposition "attachment; filename=\"$file\"" \
              --cache-control "public, max-age=0, must-revalidate"
            headers_file="$(mktemp)"
            curl --fail --silent --show-error --location --dump-header "$headers_file" --output /dev/null "$public_base/$file?verify=$GITHUB_RUN_ID"
            if ! grep -Eiq "^content-disposition:[[:space:]]*attachment" "$headers_file"; then
              echo "::error::R2 did not return attachment download headers for $file."
              cat "$headers_file"
              rm -f "$headers_file"
              exit 1
            fi
            rm -f "$headers_file"
            echo "Public attachment download verified: $file"

            # Publish a versioned Windows URL so a previous installer cannot be reused
            # by browser/CDN caches under the stable filename.
            if [ "$file" = "ImobHunter-BR-Setup-Windows.exe" ]; then
              version="${TAG#v}"
              versioned_file="ImobHunter-BR-Setup-Windows-${version}.exe"
              aws s3 cp "$file" "s3://imobhunter-downloads/$versioned_file" --endpoint-url "$endpoint" --only-show-errors \
                --content-type "application/octet-stream" \
                --content-disposition "attachment; filename=\"$versioned_file\"" \
                --cache-control "public, max-age=0, must-revalidate"
              headers_file="$(mktemp)"
              curl --fail --silent --show-error --location --dump-header "$headers_file" --output /dev/null "$public_base/$versioned_file?verify=$GITHUB_RUN_ID"
              if ! grep -Eiq "^content-disposition:[[:space:]]*attachment" "$headers_file"; then
                echo "::error::R2 did not return attachment download headers for $versioned_file."
                cat "$headers_file"
                rm -f "$headers_file"
                exit 1
              fi
              rm -f "$headers_file"
              echo "Public versioned Windows installer verified: $versioned_file"
            fi
          done
