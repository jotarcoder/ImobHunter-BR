name: GeoSampa live smoke validation

on:
  push:
    branches:
      - main
    paths:
      - "imobhunter/sources/geosampa.py"
      - "tests/test_geosampa.py"
      - ".github/workflows/geosampa-live-smoke.yml"
  pull_request:
    paths:
      - "imobhunter/sources/geosampa.py"
      - "tests/test_geosampa.py"
      - ".github/workflows/geosampa-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-wfs-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the actual application adapter
        run: python -m pip install -e .

      - name: Validate GeoSampa through the ImobHunter adapter
        run: |
          python - <<'PY'
          from imobhunter.domain.models import SearchRequest
          from imobhunter.sources.geosampa import DEFAULT_LAYER, DEFAULT_WFS_URL, GeoSampaAdapter

          request = SearchRequest(
              address="R Padre Luís Rossi",
              number="133",
              city="São Paulo",
              state="SP",
          )
          adapter = GeoSampaAdapter(timeout=20)
          records = adapter.search(request)

          print(f"Endpoint: {DEFAULT_WFS_URL}")
          print(f"Layer: {DEFAULT_LAYER}")
          print(f"Search: {request.address}, {request.number} — {request.city}/{request.state}")
          print(f"Records returned by the real adapter: {len(records)}")
          for index, record in enumerate(records[:3], start=1):
              print(
                  f"Record {index}: address={record.address!r}; "
                  f"SQL={record.attributes.get('sql')!r}; "
                  f"block={record.block!r}; lot={record.lot!r}; "
                  f"door_number={record.attributes.get('door_number')!r}; "
                  f"number_match={record.attributes.get('house_number_match')!r}; "
                  f"area_m2={record.area_m2!r}; "
                  f"geometry={'yes' if record.attributes.get('geometry_geojson') else 'no'}; "
                  f"raw_fields={record.attributes.get('source_attribute_names', [])!r}"
              )

          if not records:
              raise SystemExit(
                  "FAIL: the actual ImobHunter GeoSampa adapter returned no records "
                  "for the requested Padre Luís Rossi address. Unit tests alone do not count as live validation."
              )
          if not any(
              record.property_id or record.block or record.lot or record.area_m2 is not None
              for record in records
          ):
              raise SystemExit(
                  "FAIL: GeoSampa returned records but the adapter extracted none of the expected "
                  "parcel identifiers, block/lot fields, or land area."
              )
          exact_match = [
              record for record in records
              if str(record.attributes.get("door_number", "")).strip() == request.number
              and record.attributes.get("house_number_match") == "exact"
          ]
          if exact_match:
              print("RESULT: EXACT address number match confirmed.")
          else:
              print("RESULT: ADDRESS NUMBER NOT CONFIRMED; returned records are candidates only.")
          print("PASS: live query completed; inspect the result above to determine address match quality.")
          PY
