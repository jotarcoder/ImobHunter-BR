name: GeoSampa live smoke validation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "imobhunter/sources/geosampa.py"
      - ".github/workflows/geosampa-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-wfs-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate official GeoSampa WFS address search
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = "https://wfs.geosampa.prefeitura.sp.gov.br/geoserver/geoportal/wfs"
          layer = "geoportal:lote_cidadao"
          params = {
              "service": "WFS",
              "version": "1.0.0",
              "request": "GetFeature",
              "typeName": layer,
              "maxFeatures": "1",
              "outputFormat": "json",
              "srsName": "EPSG:4326",
              "CQL_FILTER": "nm_logradouro_completo ILIKE '%PAMPLONA%'",
          }
          url = endpoint + "?" + urllib.parse.urlencode(params)
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "ImobHunter-BR-GeoSampa-SmokeTest/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  content_type = response.headers.get("Content-Type", "")
                  body = response.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")[:500]
              raise SystemExit(f"FAIL: GeoSampa WFS returned HTTP {exc.code}: {body}") from exc
          except Exception as exc:
              raise SystemExit(f"FAIL: GeoSampa WFS request failed: {type(exc).__name__}: {exc}") from exc

          try:
              payload = json.loads(body)
          except ValueError as exc:
              raise SystemExit(
                  f"FAIL: GeoSampa WFS did not return JSON; HTTP {status}, "
                  f"Content-Type={content_type!r}, body={body[:300]!r}"
              ) from exc

          if not isinstance(payload, dict) or not isinstance(payload.get("features"), list):
              raise SystemExit(
                  "FAIL: GeoSampa WFS response is not a GeoJSON FeatureCollection: "
                  + " ".join(body[:300].split())
              )
          features = payload["features"]
          print(
              f"GeoSampa WFS: HTTP {status}; layer={layer}; "
              f"content-type={content_type}; features={len(features)}"
          )
          if not features:
              raise SystemExit(
                  "FAIL: official GeoSampa WFS returned valid GeoJSON but no PAMPLONA match. "
                  "Check the live layer fields/filter before treating the adapter as validated."
              )
          print("PASS: official GeoSampa WFS returned a live PAMPLONA feature.")
          PY
