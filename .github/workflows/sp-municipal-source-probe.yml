name: SP municipal public WFS discovery (no release)

on:
  pull_request:
    paths:
      - "scripts/probe_sp_municipal_wfs.py"
      - ".github/workflows/sp-municipal-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-wfs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Probe public WFS feature schemas (no personal records)
        run: python scripts/probe_sp_municipal_wfs.py
      - name: Upload public schema evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp-public-wfs-schema
          path: sp-municipal-public-schema.json
          if-no-files-found: warn
          retention-days: 7
